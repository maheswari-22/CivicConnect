services:
  postgres:
    image: postgres:16-alpine
    container_name: civicconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Set POSTGRES_PASSWORD in your shell or a .env file next to this one; keep DATABASE_URL in Backend/.env in step with it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: civicconnect
    ports:
      # Bound to this computer only. "5432:5432" would open the database to everyone on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - civicconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civicconnect_pgdata:
